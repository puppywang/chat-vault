name: Release

# 推送 v* tag 触发：测试 → 隔离冒烟 → npm pack + 扩展 ZIP → GitHub Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release upload

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 测试
        run: npm test

      - name: tag 与 package.json 版本一致性
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::tag v$TAG_VER 与 package.json 版本 $PKG_VER 不一致"
            exit 1
          fi

      - name: 语法检查
        run: |
          for f in src/*.js src/adapters/*.js bin/*.js; do
            node --check "$f"
          done

      - name: 冒烟测试（stats + serve 起服 + API）
        run: |
          TEST_DB="$RUNNER_TEMP/chatvault-smoke.db"
          node bin/chat-vault.js stats --db "$TEST_DB"
          node bin/chat-vault.js serve --port 8379 --no-sync --no-watch --db "$TEST_DB" &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8379/api/stats >/dev/null; then ok=1; break; fi
            sleep 1
          done
          kill $SRV 2>/dev/null || true
          if [ -z "$ok" ]; then echo "::error::serve 30s 内未就绪"; exit 1; fi

      - name: npm pack + 校验和
        run: |
          mkdir dist
          npm pack --pack-destination dist
          # 版本号别名：releases/latest/download/chat-vault.tgz 永久直链（README 安装命令用）
          cp dist/chat-vault-*.tgz dist/chat-vault.tgz
          cd extensions/chatgpt-sync
          zip -q ../../dist/chatgpt-sync.zip *.js *.html manifest.json README.md THIRD_PARTY_NOTICES.md
          cd ../../dist
          sha256sum *.tgz *.zip > SHA256SUMS.txt

      - name: 产物挂到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
